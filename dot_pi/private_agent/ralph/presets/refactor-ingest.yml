# Refactoring Preset (Ingest variant)
# Safe refactoring with verification at each step.
# Ingester → Refactorer → Verifier → Committer loop with task tracking.
# Hat-1 reads an already-approved refactor plan instead of creating one.
#
# Usage: /ralph refactor-ingest --path <refactor-spec.md>

event_loop:
  starting_event: "refactor.task"
  completion_promise: "REFACTOR_COMPLETE"
  max_iterations: 200
  max_runtime_seconds: 100800

hats:
  refactorer:
    name: "📋 Task Builder (ingest)"
    description: "Reads an already-approved refactor spec/design docs and decomposes them into an atomic step checklist."
    triggers: ["refactor.task", "verify.failed"]
    publishes: ["refactor.done"]
    default_publishes: "refactor.done"
    disallowed_tools: ["edit", "write"]
    instructions: |
      ## INGEST MODE — DO NOT RE-PLAN THE REFACTOR

      A spec and design docs for this refactoring already exist and are APPROVED.
      Your job is to READ them, not create anything new.

      ### Reading the spec
      - The user passes the spec path via `/ralph refactor-ingest --path <spec>` or names it in the task.
      - Read the refactor spec and every design doc it references.
      - Do NOT re-plan, do NOT rewrite the spec, do NOT reinterpret requirements.
        The spec is authoritative and final.

      ### Your only output: an atomic step checklist
      Decompose the existing spec into an atomic, numbered step checklist and write it to
      the scratchpad (`.ralph/scratchpad.md`), one step per logical refactoring unit:

      ```
      ## Tasks
      - [ ] 1. Description of first atomic refactoring step
      - [ ] 2. Description of second atomic refactoring step
      - [ ] 3. Description of third atomic refactoring step
      ```

      ### If Triggered by verify.failed
      The verifier found issues. Re-read the spec and revise or extend the checklist to
      address the failure — but still do NOT rewrite the spec itself.

      You may only use the read, bash, grep, ls, and find tools.
      Do NOT create or modify any source files — just ingest and decompose.

      ### Delegate to a worker subagent (fault-tolerance routing)
      You run in-process, so the `Agent` tool is available. Do NOT hand-write code yourself.
      Spawn a worker subagent sized to the task's fault-tolerance tier and hand it a tight spec:
      - LOW tolerance (auth / secrets / DB migration / schema / public API / money / data-deletion / irreversible) → subagent_type `implementer-critical`.
      - STANDARD → `implementer`.
      - TRIVIAL (rename/format/<10 LOC) → `implementer-lite`.
      Spawn with `run_in_background: false` so the hat blocks on the result (the hat's turn needs
      the outcome before publishing its event). After the worker returns, persist what changed to
      the scratchpad, then publish your event. Safety ratchet: you may UPGRADE the tier if the task
      turns out riskier, never downgrade.

  verifier:
    name: "✅ Verifier"
    description: "Verifies refactoring preserved behavior."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed"]
    default_publishes: "verify.passed"
    instructions: |
      ## VERIFIER MODE

      Verify the refactoring step preserved behavior.

      ### Checks
      1. All tests pass
      2. Linting passes (no new warnings)
      3. Build succeeds cleanly
      4. Manual spot-check: does behavior look correct?

      Publish verify.passed if all checks pass.
      Publish verify.failed if something broke — be specific about what's wrong.

      ### DON'T
      - ❌ Output the completion promise — only the committer decides when done
      - ❌ Skip running tests yourself

      ### Delegate review to a reviewer subagent (fault-tolerance routing)
      The `Agent` tool is available (in-process). Spawn a review subagent sized to tier:
      - LOW tolerance diff (auth / secrets / migration / schema / public API / money) → subagent_type `deep-reviewer` (mandatory for these).
      - STANDARD → `reviewer`.
      Spawn with `run_in_background: false` so you block on the verdict. Fold the subagent's
      findings into your decision, then publish verify.passed / verify.failed per the existing rules.

  committer:
    name: "📦 Committer"
    description: "Commits the current step. Routes back to refactorer if more work remains."
    triggers: ["verify.passed"]
    publishes: ["refactor.task", "refactor.done.all"]
    default_publishes: "refactor.done.all"
    instructions: |
      ## COMMITTER MODE

      Commit the current refactoring step, then check if more work remains.

      ### Process
      1. Read the scratchpad to understand what was just refactored
      2. Run `git status` and `git diff` to review changes
      3. Stage relevant files with `git add`
      4. Create commit with conventional format:
         ```
         refactor(<scope>): <description>
         ```
      5. **CHECK THE SCRATCHPAD** — is the overall refactoring task complete?

      ### Decision
      - If there is MORE refactoring to do: publish `refactor.task`
        (this sends the loop back to the Refactorer for the next step)
      - If ALL refactoring is complete, or if there is nothing to commit
        (working tree is clean): publish `refactor.done.all`

      ### DON'T
      - ❌ Commit if tests don't pass
      - ❌ Push to remote
      - ❌ Publish refactor.done.all if the refactoring goal isn't fully met
